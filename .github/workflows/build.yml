name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and project info
        working-directory: ESPRainMaker
        run: |
          xcodebuild -version
          ls -la

      - name: Install pods
        working-directory: ESPRainMaker
        run: pod install

      - name: List schemes
        working-directory: ESPRainMaker
        run: xcodebuild -list -workspace ESPRainMaker.xcworkspace

      - name: Build
        working-directory: ESPRainMaker
        run: |
          xcodebuild -workspace ESPRainMaker.xcworkspace \
            -scheme ESPRainMaker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ESPRainMaker
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ESPRainMaker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ESPRainMaker-ipa
          path: ESPRainMaker/ESPRainMaker.ipa
