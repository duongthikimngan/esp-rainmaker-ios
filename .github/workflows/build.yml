name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install pods
        working-directory: ESPRainMaker
        run: pod install

      - name: Show schemes and configurations
        working-directory: ESPRainMaker
        run: |
          xcodebuild -list -workspace ESPRainMaker.xcworkspace
          xcodebuild -list -project ESPRainMaker.xcodeproj

      - name: Archive
        working-directory: ESPRainMaker
        shell: bash
        run: |
          xcodebuild archive \
            -workspace ESPRainMaker.xcworkspace \
            -scheme ESPRainMaker \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ESPRainMaker.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show errors only
        if: failure()
        working-directory: ESPRainMaker
        run: grep -E "error:|BUILD FAILED|ARCHIVE FAILED|The following build commands failed" -A3 build.log | head -n 80

      - name: Package IPA
        working-directory: ESPRainMaker
        run: |
          mkdir -p Payload
          cp -R build/ESPRainMaker.xcarchive/Products/Applications/*.app Payload/
          zip -qr ESPRainMaker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ESPRainMaker-ipa
          path: ESPRainMaker/ESPRainMaker.ipa
